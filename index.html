<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Manage group expenses easily</p>
            <button id="themeToggle">🌙 Dark Mode</button>
        </header>
        <div class="main-content">
            <div class="sidebar">
                <h2>My Groups</h2>
                <button id="newGroupBtn">+ New Group</button>
                <div id="groupsList"></div>
            </div>
            <div class="content" id="mainContent">
                <div class="welcome-screen">
                    <h2>👋 Welcome!</h2>
                    <p>Create a group to start tracking expenses</p>
                </div>
            </div>
        </div>
        <footer>
            <p>Split smarter, not harder 💸</p>
        </footer>
    </div>

    <!-- Create Group Modal -->
    <div class="modal" id="createGroupModal">
        <div class="modal-box">
            <h3>Create New Group</h3>
            <input type="text" id="groupName" placeholder="Enter group name">
            <div class="modal-btns">
                <button onclick="closeModal('createGroupModal')">Cancel</button>
                <button id="createGroupBtn">Create</button>
            </div>
        </div>
    </div>

    <!-- Add Member Modal -->
    <div class="modal" id="addMemberModal">
        <div class="modal-box">
            <h3>Add Member</h3>
            <input type="text" id="memberName" placeholder="Enter member name">
            <div class="modal-btns">
                <button onclick="closeModal('addMemberModal')">Cancel</button>
                <button id="addMemberBtn">Add</button>
            </div>
        </div>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal" id="addExpenseModal">
        <div class="modal-box">
            <h3>Add Expense</h3>
            <input type="text" id="expenseDesc" placeholder="Description (e.g. Dinner)">
            <input type="number" id="expenseAmount" placeholder="Amount (₹)">
            <select id="expenseCategory">
                <option value="">Select Category</option>
                <option value="🍔 Food">🍔 Food</option>
                <option value="✈️ Travel">✈️ Travel</option>
                <option value="🛒 Shopping">🛒 Shopping</option>
                <option value="🎬 Entertainment">🎬 Entertainment</option>
                <option value="💡 Bills">💡 Bills</option>
                <option value="📌 Other">📌 Other</option>
            </select>
            <select id="expensePaidBy">
                <option value="">Who paid?</option>
            </select>
            <div class="split-box">
                <p><strong>Split Method:</strong></p>
                <div class="split-options">
                    <label><input type="radio" name="split" value="equal" checked> Equal</label>
                    <label><input type="radio" name="split" value="custom"> Select Members</label>
                    <label><input type="radio" name="split" value="percentage"> Percentage</label>
                    <label><input type="radio" name="split" value="amount"> Exact Amount</label>
                </div>
                <div id="splitConfig"></div>
            </div>
            <div id="splitPreviewContainer" class="split-preview-container" style="display:none;">
                <p><strong>📊 Split Preview:</strong></p>
                <div id="splitChart" class="split-chart"></div>
            </div>
            <div class="modal-btns">
                <button onclick="closeModal('addExpenseModal')">Cancel</button>
                <button id="addExpenseBtn">Add Expense</button>
            </div>
        </div>
    </div>

    <!-- Set Budget Modal -->
    <div class="modal" id="setBudgetModal">
        <div class="modal-box">
            <h3>🎯 Set Group Budget</h3>
            <input type="number" id="budgetAmount" placeholder="Enter budget amount (₹)" min="0">
            <div class="modal-btns">
                <button onclick="closeModal('setBudgetModal')">Cancel</button>
                <button id="removeBudgetBtn" style="background:#ef4444;">🗑️ Remove Budget</button>
                <button id="saveBudgetBtn">Save Budget</button>
            </div>
        </div>
    </div>

    <!-- AI Insights Modal -->
    <div class="modal" id="aiInsightsModal">
        <div class="modal-box" style="max-width:560px;">
            <h3>📊 Spending Insights</h3>
            <div id="aiInsightsContent">
                <div class="ai-loading">
                    <div class="ai-spinner"></div>
                    <p>Analyzing your group's expenses...</p>
                </div>
            </div>
            <div class="modal-btns" style="margin-top:15px;">
                <button onclick="closeModal('aiInsightsModal')">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
